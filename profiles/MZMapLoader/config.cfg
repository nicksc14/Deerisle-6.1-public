//INSTRUCTIONS (MAP LOADER):
// 1. (You've probably already done this) - Add mod to your server, start + stop server to create folder structure
// 2. Copy your DZEs into the DZE folder, or your mzmap files into the mzmap folder
// 3. Whitelist any problematic types below to force them to load as networked objects
// 4. If everything is broken, you can quickly just load everything as networked by using the boolean below!
//Also, optimize your mapping! Split it up, so each DZE/mzmap is for specific areas.
//Ideally you want one map file to have no two objects over 1km apart. This allows the update script to work faster, at a lower objects/tick setting!

//INSTRUCTIONS (EDITOR PLUGIN):
// 1. Load MZ MapLoader and MZ MapLoader Editor Plugin together when you launch the editor
// 2. You can edit object properties to set them to force dynamic, or clutter mode
// Clutter mode is client side only with no collision, for detail objects/small stuff
// These extra parameters only save into the mzmap file (and not the DZE). You need to export to mzmap to 'save', and re-import from mzmap to 'load' your changes!

//CONFIG PARAMETERS:
DebugModeMZ = false //Debug mode, check whats automatically going dynamic, config variables reading, etc
Download_Chunk_Size = 400 //Objects to download to client per packet on join (Default is 400)
Download_Chunk_Timeout = 200 //Milliseconds between chunk packets being sent (Default is 200)
Client_Render_Synch_Distance = 1100 //Distance where client starts to check if server side objects exist, and despawn client side static (Default is 1100)
Update_Per_Tick = 20 //How many objecs to check/update per tick (Default is 20)
Force_All_Dynamic = false //If sh*t is hitting the fan for some reason this is your 'panic button'

//Whitelist types here, one per line
Whitelist:
Land_Underground_Panel //Underground Panel

//Partial matches use string.Contains()). If the line starts with $ it will also remove case sensitivity for that type name (use with care)
Whitelist_PartialMatch:
CS_ //Some Canadian Sniper assets dont play nice
$stair //Player stutters a bit running down non-networked stairs
$reinforcedtank //Likes to go invisible / despawn client side
$lever //Underground switch (needs to be networked to function)
$switch //Some other switches (needs to be networked to function)
WaterSpring //Sakhal water springs
Well_Pump //Wells
